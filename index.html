    <script>
        // =====================================================================
        // 1. 전역 상태 & 지도 인스턴스 관리
        // =====================================================================
        let mapOrigin = null;
        let mapAntipode = null;
        let originMarker = null;
        let antipodeMarker = null;

        let originSatelliteLayer = null;
        let originStandardLayer = null;
        let antipodeSatelliteLayer = null;
        let antipodeStandardLayer = null;

        // 기본값: 🛰️ 위성뷰 활성화 (Esri World Imagery)
        let isSatelliteMode = true;

        let currentOrigin = {
            lat: 37.5665,
            lon: 126.9780,
            label: '🇰🇷 한국 · 서울'
        };

        let lookupTimer = null;

        // =====================================================================
        // 2. 지도 초기화 & Resize / invalidateSize 보장
        // =====================================================================
        function initMaps() {
            const anti = computeAntipode(currentOrigin.lat, currentOrigin.lon);

            // 타일 레이어 생성 (Esri World Imagery 위성 & CartoDB Voyager 일반지도)
            const esriUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            const cartoUrl = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

            originSatelliteLayer = L.tileLayer(esriUrl, {
                maxZoom: 19,
                attribution: '&copy; Esri, Maxar, Earthstar Geographics'
            });
            originStandardLayer = L.tileLayer(cartoUrl, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            });

            antipodeSatelliteLayer = L.tileLayer(esriUrl, {
                maxZoom: 19,
                attribution: '&copy; Esri, Maxar, Earthstar Geographics'
            });
            antipodeStandardLayer = L.tileLayer(cartoUrl, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            });

            // 상단 출발 지도 초기화 (50vh)
            mapOrigin = L.map('mapOrigin', {
                center: [currentOrigin.lat, currentOrigin.lon],
                zoom: 6,
                zoomControl: true,
                layers: [originSatelliteLayer]
            });

            // 하단 반대편 지도 초기화 (50vh)
            mapAntipode = L.map('mapAntipode', {
                center: [anti.lat, anti.lon],
                zoom: 6,
                zoomControl: true,
                layers: [antipodeSatelliteLayer]
            });

            // 파란색 펄스 출발 마커 (드래그 가능)
            const originIcon = L.divIcon({
                className: 'origin-custom-marker',
                html: `
                    <div class="relative flex items-center justify-center w-8 h-8 -ml-4 -mt-4 cursor-grab active:cursor-grabbing">
                        <span class="absolute w-8 h-8 rounded-full bg-cyan-400/50 origin-pulse-ring"></span>
                        <span class="relative w-4 h-4 rounded-full bg-cyan-400 border-[2.5px] border-white shadow-[0_0_12px_#22d3ee]"></span>
                    </div>
                `,
                iconSize: [0, 0]
            });

            // 빨간색 타겟 반대편 마커
            const antipodeIcon = L.divIcon({
                className: 'antipode-custom-marker',
                html: `
                    <div class="relative flex items-center justify-center w-8 h-8 -ml-4 -mt-4 pointer-events-none">
                        <span class="absolute w-8 h-8 rounded-full bg-rose-500/45 target-pulse-ring"></span>
                        <span class="relative w-4 h-4 rounded-full bg-rose-500 border-[2.5px] border-white shadow-[0_0_14px_#f43f5e]"></span>
                    </div>
                `,
                iconSize: [0, 0]
            });

            originMarker = L.marker([currentOrigin.lat, currentOrigin.lon], {
                icon: originIcon,
                draggable: true
            }).addTo(mapOrigin);

            antipodeMarker = L.marker([anti.lat, anti.lon], {
                icon: antipodeIcon,
                interactive: false
            }).addTo(mapAntipode);

            // 상단 지도 클릭 이벤트 -> 출발점 업데이트 & 반대편 이동
            mapOrigin.on('click', (e) => {
                setOriginPoint(e.latlng.lat, normalizeLon(e.latlng.lng), '선택한 출발 좌표', true);
            });

            // 출발 마커 드래그 이벤트 -> 실시간 반대편 좌표 동기화
            originMarker.on('drag', (e) => {
                const pos = e.target.getLatLng();
                updateLabelsAndMarkerOnly(pos.lat, normalizeLon(pos.lng), '드래그 이동 중...');
            });
            originMarker.on('dragend', (e) => {
                const pos = e.target.getLatLng();
                setOriginPoint(pos.lat, normalizeLon(pos.lng), '드래그 지정 지점', true);
            });

            // 하단 반대편 지도 클릭 이벤트 -> 역대척점 계산 후 상단 지도 동기화
            mapAntipode.on('click', (e) => {
                const clickedAntiLat = e.latlng.lat;
                const clickedAntiLon = normalizeLon(e.latlng.lng);
                const reverseOrigin = computeAntipode(clickedAntiLat, clickedAntiLon);
                setOriginPoint(reverseOrigin.lat, reverseOrigin.lon, '반대편 지도에서 역산된 지점', true);
            });

            // 초기 타일 렌더링 보정 및 리사이즈 리스너
            refreshMapSizes();
            window.addEventListener('resize', refreshMapSizes);

            // 최초 반대편 정보 및 사진 조회
            fetchAntipodeDetails(anti.lat, anti.lon);
            updateSatelliteCloseup(anti.lat, anti.lon, 10);
        }

        function refreshMapSizes() {
            requestAnimationFrame(() => {
                if (mapOrigin) mapOrigin.invalidateSize({ animate: false });
                if (mapAntipode) mapAntipode.invalidateSize({ animate: false });
            });
        }

        // =====================================================================
        // 3. 대척점(Antipode) 계산 및 좌표 포맷팅
        // =====================================================================
        function normalizeLon(lon) {
            let wrapped = ((lon + 180) % 360 + 360) % 360 - 180;
            return wrapped;
        }

        function computeAntipode(lat, lon) {
            const clampedLat = Math.max(-90, Math.min(90, lat));
            const wrappedLon = normalizeLon(lon);
            const antiLat = -clampedLat;
            const antiLon = wrappedLon > 0 ? wrappedLon - 180 : wrappedLon + 180;
            return { lat: antiLat, lon: normalizeLon(antiLon) };
        }

        function formatLat(lat) {
            const hemi = lat >= 0 ? 'N' : 'S';
            return `${Math.abs(lat).toFixed(4)}° ${hemi}`;
        }

        function formatLon(lon) {
            const hemi = lon >= 0 ? 'E' : 'W';
            return `${Math.abs(lon).toFixed(4)}° ${hemi}`;
        }

        function updateLabelsAndMarkerOnly(lat, lon, labelText) {
            const anti = computeAntipode(lat, lon);
            document.getElementById('originPlaceLabel').textContent = labelText;
            document.getElementById('originCoordsLabel').textContent = `${formatLat(lat)}, ${formatLon(lon)}`;
            document.getElementById('antipodeCoordsLabel').textContent = `${formatLat(anti.lat)}, ${formatLon(anti.lon)}`;
            antipodeMarker.setLatLng([anti.lat, anti.lon]);
        }

        function setOriginPoint(lat, lon, labelText, shouldFlyAntipode = true) {
            const clampedLat = Math.max(-89.99, Math.min(89.99, lat));
            const normLon = normalizeLon(lon);
            currentOrigin = { lat: clampedLat, lon: normLon, label: labelText };

            const anti = computeAntipode(clampedLat, normLon);

            originMarker.setLatLng([clampedLat, normLon]);
            antipodeMarker.setLatLng([anti.lat, anti.lon]);

            document.getElementById('originPlaceLabel').textContent = labelText;
            document.getElementById('originCoordsLabel').textContent = `${formatLat(clampedLat)}, ${formatLon(normLon)}`;
            document.getElementById('antipodeCoordsLabel').textContent = `${formatLat(anti.lat)}, ${formatLon(anti.lon)}`;

            if (shouldFlyAntipode && mapAntipode) {
                const targetZoom = Math.max(mapAntipode.getZoom(), 5);
                mapAntipode.flyTo([anti.lat, anti.lon], targetZoom, {
                    duration: 1.1
                });
            }

            updateSatelliteCloseup(anti.lat, anti.lon, 10);

            // 연속 클릭/드래그 시 API 과호출 방지 디바운스
            if (lookupTimer) clearTimeout(lookupTimer);
            lookupTimer = setTimeout(() => {
                fetchAntipodeDetails(anti.lat, anti.lon);
            }, 220);
        }

        function handlePresetClick(lat, lon, label) {
            setOriginPoint(lat, lon, label, true);
            if (mapOrigin) {
                const targetZoom = Math.max(mapOrigin.getZoom(), 5);
                mapOrigin.flyTo([lat, lon], targetZoom, { duration: 0.9 });
            }
        }

        // =====================================================================
        // 4. 내 위치 찾기 & 위성뷰 / 일반지도 전환
        // =====================================================================
        function locateUser() {
            const btnLabelEl = document.getElementById('originPlaceLabel');
            if (!navigator.geolocation) {
                btnLabelEl.textContent = '브라우저 위치 미지원 (서울 유지)';
                return;
            }
            btnLabelEl.textContent = '📍 현재 위치 찾는 중...';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    setOriginPoint(latitude, longitude, '📍 내 현재 위치', true);
                    mapOrigin.flyTo([latitude, longitude], 10, { duration: 1.0 });
                },
                () => {
                    setOriginPoint(37.5665, 126.9780, '🇰🇷 한국 · 서울 (위치 권한 필요)', true);
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        }

        function toggleBasemap() {
            isSatelliteMode = !isSatelliteMode;
            const btn = document.getElementById('basemapToggleBtn');

            if (isSatelliteMode) {
                if (mapOrigin.hasLayer(originStandardLayer)) mapOrigin.removeLayer(originStandardLayer);
                if (!mapOrigin.hasLayer(originSatelliteLayer)) mapOrigin.addLayer(originSatelliteLayer);

                if (mapAntipode.hasLayer(antipodeStandardLayer)) mapAntipode.removeLayer(antipodeStandardLayer);
                if (!mapAntipode.hasLayer(antipodeSatelliteLayer)) mapAntipode.addLayer(antipodeSatelliteLayer);

                btn.textContent = '🛰️ 위성뷰';
            } else {
                if (mapOrigin.hasLayer(originSatelliteLayer)) mapOrigin.removeLayer(originSatelliteLayer);
                if (!mapOrigin.hasLayer(originStandardLayer)) mapOrigin.addLayer(originStandardLayer);

                if (mapAntipode.hasLayer(antipodeSatelliteLayer)) mapAntipode.removeLayer(antipodeSatelliteLayer);
                if (!mapAntipode.hasLayer(antipodeStandardLayer)) mapAntipode.addLayer(antipodeStandardLayer);

                btn.textContent = '🗺️ 일반지도';
            }
        }

        // =====================================================================
        // 5. 역지오코딩(Nominatim), Wikimedia Commons 현장 사진 & Esri 위성 스냅샷
        // =====================================================================
        function latLonToTileXY(lat, lon, zoom) {
            const latRad = (lat * Math.PI) / 180;
            const n = Math.pow(2, zoom);
            const xtile = Math.floor(((lon + 180) / 360) * n);
            const ytile = Math.floor(
                ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n
            );
            return { x: xtile, y: ytile };
        }

        function updateSatelliteCloseup(lat, lon, zoom = 10) {
            const tile = latLonToTileXY(lat, lon, zoom);
            const satImg = document.getElementById('satCloseupImg');
            document.getElementById('satZoomBadge').textContent = `Z${zoom}`;
            satImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${tile.y}/${tile.x}`;
        }

        function onWikiImgLoad() {
            const img = document.getElementById('wikiFieldImg');
            const placeholder = document.getElementById('wikiPlaceholder');
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function onWikiImgError() {
            const img = document.getElementById('wikiFieldImg');
            const placeholder = document.getElementById('wikiPlaceholder');
            const iconEl = document.getElementById('wikiStatusIcon');
            const textEl = document.getElementById('wikiStatusText');
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
            iconEl.textContent = '🛰️';
            textEl.textContent = '현장 사진 대신 우측 위성 확대 뷰를 확인하세요';
        }

        async function fetchAntipodeDetails(antiLat, antiLon) {
            const terrainBadge = document.getElementById('terrainBadge');
            const locNameEl = document.getElementById('antipodeLocationName');
            const wikiImg = document.getElementById('wikiFieldImg');
            const wikiPlaceholder = document.getElementById('wikiPlaceholder');
            const wikiIcon = document.getElementById('wikiStatusIcon');
            const wikiText = document.getElementById('wikiStatusText');
            const wikiCaption = document.getElementById('wikiCaptionText');

            terrainBadge.textContent = '탐사 중...';
            terrainBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700';

            // 1) OpenStreetMap Nominatim Reverse Geocoding (육지 vs 바다 판별)
            let isOcean = true;
            try {
                const nomUrl = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${antiLat.toFixed(5)}&lon=${antiLon.toFixed(5)}&zoom=6&accept-language=ko`;
                const res = await fetch(nomUrl, { headers: { 'Accept': 'application/json' } });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.display_name) {
                        isOcean = false;
                        const shortName = data.display_name.split(',').slice(0, 3).join(',').trim();
                        locNameEl.textContent = `· ${shortName}`;
                        terrainBadge.textContent = '🏔️ 육지 출구';
                        terrainBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40';
                    } else {
                        isOcean = true;
                        locNameEl.textContent = '· 망망대해 한가운데';
                        terrainBadge.textContent = '🌊 바다 출구';
                        terrainBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/20 text-sky-300 border border-sky-400/40';
                    }
                } else {
                    throw new Error('Nominatim non-OK');
                }
            } catch (err) {
                isOcean = true;
                locNameEl.textContent = '· 외양 / 미상 해역';
                terrainBadge.textContent = '🌊 바다 / 해역';
                terrainBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/20 text-sky-300 border border-sky-400/40';
            }

            // 2) Wikimedia Commons Geosearch API로 인근 지오태그 사진 조회
            wikiImg.classList.add('hidden');
            wikiPlaceholder.classList.remove('hidden');
            wikiIcon.textContent = isOcean ? '🌊' : '📷';
            wikiText.textContent = '주변 현장 사진 검색 중...';

            try {
                const radius = isOcean ? 250000 : 120000; // 바다일 경우 인근 섬/해안까지 넓게 탐색
                const wikiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${antiLat.toFixed(5)}|${antiLon.toFixed(5)}&ggsradius=${radius}&ggslimit=12&ggsnamespace=6&prop=imageinfo|coordinates&iiprop=url|extmetadata&iiurlwidth=480&format=json&origin=*`;
                const wRes = await fetch(wikiUrl);
                if (!wRes.ok) throw new Error('Wiki API error');
                const wData = await wRes.json();

                const pages = wData?.query?.pages ? Object.values(wData.query.pages) : [];
                // 일반 사진 파일 필터링 (.jpg, .jpeg, .png, .webp)
                const validPhotoPage = pages.find((p) => {
                    const url = p?.imageinfo?.[0]?.thumburl || p?.imageinfo?.[0]?.url || '';
                    return /\.(jpe?g|png|webp)$/i.test(url) && !/map|chart|diagram|flag|logo|icon/i.test(p.title || '');
                });

                if (validPhotoPage) {
                    const info = validPhotoPage.imageinfo[0];
                    const imgUrl = info.thumburl || info.url;
                    const cleanTitle = (validPhotoPage.title || '현장 사진').replace(/^File:/i, '').replace(/\.[^.]+$/, '').replace(/_/g, ' ');
                    wikiCaption.textContent = cleanTitle;
                    wikiImg.src = imgUrl;
                } else {
                    wikiIcon.textContent = isOcean ? '🌊' : '🛰️';
                    wikiText.textContent = isOcean
                        ? '외양 한가운데로 현장 사진 없음 (위성 뷰 확인)'
                        : '인근 등록 사진 없음 (위성 확대 뷰 확인)';
                    wikiCaption.textContent = isOcean ? '대양 위성 스냅샷' : '육지 위성 스냅샷';
                }
            } catch (err) {
                wikiIcon.textContent = '🛰️';
                wikiText.textContent = '사진 불러오기 실패 · 우측 위성 스냅샷 표시 중';
                wikiCaption.textContent = '위성 클로즈업';
            }
        }

        // =====================================================================
        // 6. 상단 프리셋 슬라이더 스와이프 / 마우스 드래그 / 휠 지원
        // =====================================================================
        function initSwipeableSlider() {
            const slider = document.getElementById('presetSlider');
            if (!slider) return;

            let isMouseDown = false;
            let startX = 0;
            let scrollLeftStart = 0;
            let draggedDistance = 0;

            slider.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                draggedDistance = 0;
                startX = e.pageX - slider.offsetLeft;
                scrollLeftStart = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => {
                isMouseDown = false;
            });

            slider.addEventListener('mouseup', () => {
                isMouseDown = false;
                setTimeout(() => { draggedDistance = 0; }, 30);
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.4;
                draggedDistance = Math.abs(x - startX);
                slider.scrollLeft = scrollLeftStart - walk;
            });

            // 드래그 중 실수로 버튼 클릭이 발동되는 것 방지
            slider.addEventListener('click', (e) => {
                if (draggedDistance > 8) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            // 마우스 휠을 가로 스크롤로 변환
            slider.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    slider.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }

        // =====================================================================
        // 7. 앱 시작
        // =====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            initSwipeableSlider();
            initMaps();
        });
    </script>
</body>
</html>
